id: pki-dns01-wildcard
name: PKI DNS-01 Wildcard Certificate Example
description: Request and deploy a wildcard certificate with a TSIG-scoped RFC 2136 DNS-01 challenge.
runner: internet
script: scenario.py
platform: amd
features:
  - example-runner
  - pki-ca-service
  - pki-dns01
  - web-service

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 300

build:
  enabled: true
  timeout: 1200

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: CA, authoritative DNS, web, and client nodes are running
      type: compose-ps
      services:
        - hnode_150_ca
        - hnode_150_dns
        - hnode_150_web
        - hnode_150_client
      retries: 30
      interval: 2

probes:
  - name: Client reaches the web node before certificate deployment
    type: exec
    service: hnode_150_client
    command: curl -fsS http://api.svc.pki.test/
    expect_exit: 0
    retries: 20
    interval: 3

test_programs:
  - name: verify DNS-01 issuance, deployment, and challenge cleanup
    script: test_runtime.py
    timeout: 300
