id: h12-domain-name-purchase
name: H12 Domain Purchase and DNS Hosting
description: Runtime validation for Registry, FOSSBilling, DNS Hosting, and FakePayment.
runner: internet
script: domain_name_purchase.py
platform: amd
features:
  - domain-registration
  - dns-hosting
  - fake-payment

compile:
  enabled: true
  output: output
  clean:
    - output
  expected:
    - output/docker-compose.yml
  timeout: 300

build:
  enabled: true
  timeout: 3600

runtime:
  compose: output/docker-compose.yml
  readiness:
    - name: H12 application and DNS containers are running
      type: compose-ps
      services:
        - hnode_150_host_1
        - hnode_151_host_1
        - hnode_160_host_0
        - hnode_170_host_0
        - hnode_170_host_1
        - hnode_153_local-dns-2
      retries: 30
      interval: 2
    - name: FOSSBilling and payment gateway initialization completed
      type: exec
      service: hnode_150_host_1
      command: test -f /run/fossbilling-initialized && test -f /run/fake-payment-initialized && test ! -f /run/fossbilling-initialization.failed && test ! -f /run/fake-payment-initialization.failed
      retries: 120
      interval: 5

probes:
  - name: Registrar reaches Registry control panel
    type: exec
    service: hnode_150_host_1
    command: curl --connect-timeout 3 --max-time 10 -fsS http://10.151.0.72:8080/ >/dev/null
    retries: 20
    interval: 3
  - name: Registrar reaches FakePayment
    type: exec
    service: hnode_150_host_1
    command: curl --connect-timeout 3 --max-time 10 -fsS http://10.160.0.71:8080/health
    expect_stdout_contains: ok
    retries: 20
    interval: 3

test_programs:
  - name: H12 custom runtime validation
    script: test_runtime.py
    timeout: 3600
