[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seedemu-agent-tool-service"
version = "0.1.0"
description = "Agent-facing tools and services for SEED-Emulator"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "docker>=7.2,<8.0",
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.41,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<3.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.15,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["seedemu_tool_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
