services:
  tool-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: seedemu-agent-tool-service:dev
    init: true
    restart: unless-stopped
    ports:
      - "${TOOL_SERVICE_PORT:-8000}:8000"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
